<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dar Zina - Cuisine Marocaine Traditionnelle</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #eee;
    }
    header h1 {
      color: #c0603a;
    }
    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #333;
    }
    .hero {
      display: flex;
      align-items: center;
      padding: 60px 40px;
      gap: 40px;
    }
    .hero-text {
      flex: 1;
    }
    .hero-text h2 {
      font-size: 48px;
    }
    .tag {
      display: inline-block;
      background: #f5e9dd;
      padding: 8px 16px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .btn {
      background: #c0603a;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
    }
    .hero-img img {
      width: 100%;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Dar Zina دار زينة</h1>
    <nav>
      <a href="#">Accueil</a>
      <a href="#">Notre menu</a>
      <a href="#">À propos</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <span class="tag">Cuisine marocaine traditionnelle</span>
      <h2>Bienvenue chez Dar Zina</h2>
      <p>Savourez une cuisine marocaine traditionnelle dans une ambiance chaleureuse et conviviale. Des plats maison, préparés avec amour, comme à la maison.</p>
      <a href="#" class="btn">Voir le menu</a>
    </div>
    <div class="hero-img">
      <img src="https://via.placeholder.com/500x400" alt="Tajine Dar Zina">
    </div>
  </section>

</body>
</html>
